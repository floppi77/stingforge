# OpenSSF Scorecard: bewertet Projektverwaltung und Lieferkette (Branch-Schutz,
# gepinnte Abhängigkeiten, Token-Rechte, signierte Releases …). Ergebnisse erscheinen
# unter Security › Code scanning und auf scorecard.dev. Für private Repositories ist
# beides nicht verfügbar, der Job läuft deshalb erst, wenn das Repository öffentlich ist.
name: Scorecard

on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: '17 5 * * 3'
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    name: Scorecard
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: scorecard.sarif
