# OpenSSF Scorecard: bewertet Projektverwaltung und Lieferkette (Branch-Schutz,
# gepinnte Abhängigkeiten, Token-Rechte, signierte Releases …). Ergebnisse erscheinen
# unter Security › Code scanning und auf scorecard.dev. Für private Repositories ist
# beides nicht verfügbar, der Job läuft deshalb erst, wenn das Repository öffentlich ist.
name: Scorecard

on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: '17 5 * * 3'
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    name: Scorecard
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: scorecard.sarif
