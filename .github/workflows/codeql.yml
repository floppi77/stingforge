# CodeQL: Sicherheitslücken im Quellcode (Python-Werkzeuge und GitHub-Workflows;
# GDScript unterstützt CodeQL nicht). Code Scanning ist für private Repositories nur
# mit GitHub Advanced Security verfügbar, die Jobs laufen deshalb erst, wenn das
# Repository öffentlich ist. Bis dahin decken Bandit und zizmor (security.yml) beides ab.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 4 * * 2'
  workflow_dispatch:

permissions: {}

jobs:
  analyze:
    name: Analyse (${{ matrix.language }})
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
