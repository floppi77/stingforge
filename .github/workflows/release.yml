# Release-Build in der CI: aus einem Tag (v*) entstehen die Spieldateien für Linux,
# Windows und macOS. Dazu kommen SHA256SUMS.txt und, sobald das Repository öffentlich
# ist, signierte Herkunftsnachweise (Build Provenance über Sigstore).
#   - Godot und die Exportvorlagen werden gegen die SHA-512-Summen des Godot-Projekts geprüft.
#   - Linux-Datei startet zur Probe ohne Fenster; die Mac-App wird auf Aufbau geprüft.
#   - Existiert das Release schon, werden die Dateien ersetzt, sonst entsteht ein Entwurf
#     mit automatischen Release Notes, den man vor der Veröffentlichung prüft.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Vorhandenes Tag, z. B. v0.4.1'
        required: true

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Bauen, prüfen, veröffentlichen
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GODOT_VERSION: 4.7.2
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Godot und Exportvorlagen laden (SHA-512 geprüft)
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          editor="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          templates="Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          curl -fsSLO "$base/SHA512-SUMS.txt"
          for f in "$editor.zip" "$templates"; do
            curl -fsSLO "$base/$f"
            grep -F "  $f" SHA512-SUMS.txt | sha512sum -c -
          done
          unzip -q "$editor.zip"
          sudo install -m 755 "$editor" /usr/local/bin/godot
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          unzip -q "$templates" -d tpl
          mv tpl/templates/* "$dest/"
          godot --version

      # Godot stürzt beim Beenden gelegentlich ab, nachdem der Import fertig ist.
      # Maßgeblich ist der Importordner; ein echter Fehler fällt spätestens beim Export auf.
      - name: Assets importieren
        run: godot --headless --path . --import || test -d .godot/imported

      - name: Exportieren
        run: |
          mkdir -p build/linux build/windows build/macos dist
          godot --headless --path . --export-release Linux build/linux/Stingforge.x86_64
          godot --headless --path . --export-release Windows build/windows/Stingforge.exe
          godot --headless --path . --export-release macOS build/macos/Stingforge-macOS.zip
          cp build/linux/Stingforge.x86_64 build/windows/Stingforge.exe build/macos/Stingforge-macOS.zip dist/

      - name: Dateien prüfen
        run: |
          for f in dist/Stingforge.x86_64 dist/Stingforge.exe; do
            test "$(tail -c 4 "$f")" = "GDPC" || { echo "Kein eingebettetes PCK: $f"; exit 1; }
          done
          python3 -c "import importlib.util as u; s = u.spec_from_file_location('v', 'tools/verify_stingforge_r3_exports.py'); m = u.module_from_spec(s); s.loader.exec_module(m); m.check_mac(m.Path('dist/Stingforge-macOS.zip'))"
          chmod +x dist/Stingforge.x86_64
          dist/Stingforge.x86_64 --headless --audio-driver Dummy --quit-after 240

      - name: Prüfsummen
        working-directory: dist
        run: |
          sha256sum Stingforge.x86_64 Stingforge.exe Stingforge-macOS.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Artefakt-Attestierungen stehen für private Repositories nur mit GitHub Enterprise
      # zur Verfügung. Der Schritt läuft deshalb erst, wenn das Repository öffentlich ist.
      - name: Herkunftsnachweis (Build Provenance)
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/Stingforge.x86_64
            dist/Stingforge.exe
            dist/Stingforge-macOS.zip

      - name: Release anlegen oder aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --draft --verify-tag --generate-notes --title "Stingforge $TAG"
          fi

      # VirusTotal: läuft nur, wenn das Repository-Secret VT_API_KEY gesetzt ist.
      # Achtung: hochgeladene Dateien teilt VirusTotal mit Sicherheitsanbietern.
      - name: VirusTotal-Schlüssel vorhanden?
        id: vt
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: echo "enabled=$([ -n "$VT_API_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: VirusTotal-Prüfung
        id: virustotal
        if: ${{ steps.vt.outputs.enabled == 'true' }}
        uses: crazy-max/ghaction-virustotal@936d8c5c00afe97d3d9a1af26d017cfdf26800a2 # v5.0.0
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: |
            dist/Stingforge.x86_64
            dist/Stingforge.exe
            dist/Stingforge-macOS.zip
          request_rate: 4
      - name: VirusTotal-Links in die Release Notes
        if: ${{ steps.vt.outputs.enabled == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ANALYSIS: ${{ steps.virustotal.outputs.analysis }}
        run: |
          {
            gh release view "$TAG" --json body --jq .body
            printf '\n\n### VirusTotal\n\n'
            echo "$ANALYSIS" | tr ',' '\n' | sed -E 's#^([^=]+)=(.*)$#- [\1](\2)#'
          } > notes.md
          gh release edit "$TAG" --notes-file notes.md
