# Dependabot hält die gepinnten GitHub Actions und die hashgepinnten Prüfwerkzeuge
# (Bandit, zizmor) aktuell, wöchentlich und jeweils gesammelt in einem PR.
# Das Spiel selbst hat keine Paketabhängigkeiten; Godot ist in den Workflows fest gepinnt.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'CI'
  - package-ecosystem: pip
    directory: /.github/requirements
    schedule:
      interval: weekly
    groups:
      pruefwerkzeuge:
        patterns: ['*']
    commit-message:
      prefix: 'CI'
